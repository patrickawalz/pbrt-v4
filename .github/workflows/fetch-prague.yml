name: Prague sky model datasets

# Adds to the release prague-sky-datasets-v1 of this repository the datasets made from the wide (SWIR) dataset with
# praguedata (branch pbr-lights):
#   - PragueSkyVisible.dat: the channels of 360 to 840 nm (what the film samples)
#   - PragueSkyGround14.dat: the channels of 280 to 840 nm
# The full dataset is on the release in two parts (a release file cannot be larger than 2 GiB):
#   cat PragueSkyModelDatasetFull.dat.part1 PragueSkyModelDatasetFull.dat.part2 > PragueSkyModelDatasetFull.dat
# and the full dataset with the wide channels on the ground is made from them by
#   praguedata combine PragueSkyFullWide.dat PragueSkyModelDatasetFull.dat PragueSkyGround14.dat
# Runs when this branch is pushed.
on:
  push:
    branches: [prague-data]

permissions:
  contents: write

jobs:
  trimmed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pbr-lights
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build praguedata
        run: |
          cd src/pbrt
          for i in 1 2 3 4 5 6 7 8; do
            if dotnet build cmd/praguedata.csproj -c Release; then break; fi
          done
          ls -l cmd/bin/Release/net10.0/praguedata.dll
      - name: Trim the wide dataset and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download prague-sky-datasets-v1 --repo "$GITHUB_REPOSITORY" --pattern PragueSkyModelDatasetSWIR.dat
          echo "33b97729ce8cd7fbdfc60317ff2805e7  PragueSkyModelDatasetSWIR.dat" | md5sum -c
          dotnet src/pbrt/cmd/bin/Release/net10.0/praguedata.dll trim PragueSkyModelDatasetSWIR.dat PragueSkyVisible.dat
          dotnet src/pbrt/cmd/bin/Release/net10.0/praguedata.dll trim PragueSkyModelDatasetSWIR.dat PragueSkyGround14.dat 280 839
          echo "e8ee91e896ae54da6b74c090b1c641d5  PragueSkyVisible.dat" | md5sum -c
          echo "f049f2ec991a5d41473e044d3e0d179b  PragueSkyGround14.dat" | md5sum -c
          gh release upload prague-sky-datasets-v1 PragueSkyVisible.dat PragueSkyGround14.dat --repo "$GITHUB_REPOSITORY" --clobber
