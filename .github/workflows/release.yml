name: release

# Every push builds Linux and Windows packages and uploads them as workflow artifacts (kept 90 days).
# Pushing a tag such as v0.1.0, or bumping the VERSION file on main, also publishes them as a GitHub Release.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Self-contained: no .NET install needed to run. Each tool is published to its own directory and the
      # results are merged (identical runtime files are not overwritten), because publishing several tools
      # into one directory loses the earlier tools' files.
      - name: Publish tools
        shell: bash
        run: |
          PKG=package/pbrt-v4-${{ matrix.rid }}
          mkdir -p "$PKG"
          for p in pbrt_exe imgtool plytool cyhair2pbrt nanovdb2pbrt pspec rgb2spec_opt; do
            dotnet publish src/pbrt/cmd/$p.csproj -c Release -r ${{ matrix.rid }} --self-contained true \
              -p:UseAppHost=true -nologo -v minimal -o package/tmp/$p
            cp -rn package/tmp/$p/. "$PKG/"
          done
          mkdir -p "$PKG/scenes"
          cp -r scenes/. "$PKG/scenes/"
          cp LICENSE.txt THIRD_PARTY.md README.md "$PKG/"
          ls "$PKG" | grep -E "^(pbrt|imgtool|plytool|cyhair2pbrt|nanovdb2pbrt|pspec|rgb2spec_opt)(\.exe)?$|^pbrt_lib\.dll$"
          for f in pbrt imgtool plytool cyhair2pbrt nanovdb2pbrt pspec rgb2spec_opt; do
            if [ "${{ runner.os }}" = "Windows" ]; then f="$f.exe"; fi
            test -f "$PKG/$f" || { echo "missing $f in package"; exit 1; }
          done
          test -f "$PKG/pbrt_lib.dll" || { echo "missing pbrt_lib.dll"; exit 1; }

      - name: Zip (Linux)
        if: runner.os == 'Linux'
        working-directory: package
        run: zip -qr ../pbrt-v4-${{ matrix.rid }}.zip pbrt-v4-${{ matrix.rid }}

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        working-directory: package
        shell: pwsh
        run: Compress-Archive -Path pbrt-v4-${{ matrix.rid }} -DestinationPath ../pbrt-v4-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: pbrt-v4-${{ matrix.rid }}
          path: pbrt-v4-${{ matrix.rid }}.zip
          retention-days: 90

  release:
    # Runs for tags (v*) and for pushes to main. On main, the release tag is taken from the VERSION file and
    # the release is created only if "v<VERSION>" does not exist yet, so bumping VERSION makes a new release.
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release if new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(tr -d '[:space:]' < VERSION)"
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
          else
            gh release create "$TAG" artifacts/*.zip --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" --title "$TAG" --generate-notes
          fi
